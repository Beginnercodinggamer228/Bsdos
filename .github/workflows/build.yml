name: Build driver

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-driver:
    runs-on: windows-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v3
    
    - name: Setup WDK
      run: |
        choco install windows-sdk -y
        choco install wdk -y
    
    - name: Setup MSVC
      uses: microsoft/setup-msbuild@v1.1
    
    - name: Build Driver
      run: |
        mkdir build

        cl /nologo /W4 /Gs /Zi /MT /Os /O1 /GF /GS /Gz /kernel /Zl /Zp8 /D"_WIN32_WINNT=0x0601" /D"NTDDI_VERSION=0x06010000" /D"DBG=1" /D"NDEBUG" /Fe:build/bsod_driver.sys /Fo:build/ driver/bsod_driver.c

        copy driver\bsod_driver.inf build\
    
    - name: Create client tool
      run: |
        cl /nologo /O2 /Fe:build/bsod_trigger.exe /Fo:build/ client/trigger_bsod.c

        pip install pyinstaller
        pyinstaller --onefile --name bsdos client/bsdos_cli.py
        
        copy dist\bsdos.exe build\
    
    - name: Create package
      run: |
        mkdir release
        copy build\bsod_driver.sys release\
        copy build\bsod_driver.inf release\
        copy build\bsod_trigger.exe release\
        copy build\bsdos.exe release\
        copy src\errors.json release\
        echo "@echo off" > release\install.bat
        echo "echo Installing BSOD Driver..." >> release\install.bat
        echo "sc create BSODDriver binPath= %CD%\bsod_driver.sys type= kernel start= demand" >> release\install.bat
        echo "sc start BSODDriver" >> release\install.bat
        echo "echo Driver installed!" >> release\install.bat
        echo "@echo off" > release\trigger.bat
        echo "bsod_trigger.exe %%1" >> release\trigger.bat
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v3
      with:
        name: bsod-driver-package
        path: release/
